name: Diagnose Cloudflare checkbox
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinema-challenge-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser cache key
        id: browser-key
        # Refresh upstream browser/GeoIP downloads weekly or when dependencies change.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Camoufox runtime
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ steps.browser-key.outputs.week }}
      - name: Download Camoufox runtime on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install camoufox-js fetch
      - name: Ensure virtual display tools
        run: |
          if command -v Xvfb >/dev/null; then
            echo "Using preinstalled Xvfb"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
      - name: Verify browser and install system libraries only if missing
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm run prepare-browser
      - name: Save prepared Camoufox runtime
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Executable, addons and GeoIP only. Browser profiles live in temporary directories.
          path: ~/.cache/camoufox
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Probe initial page and checkbox
        run: timeout --signal=TERM --kill-after=10s 120s node --import tsx scripts/challenge-probe.ts
      - name: Upload diagnostic report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: challenge-probe-${{ github.run_id }}
          path: |
            work/challenge-probe/report.json
            work/challenge-probe/*.png
          if-no-files-found: warn
          retention-days: 1
