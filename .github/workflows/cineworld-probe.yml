name: Cineworld London IMAX access probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cineworld-access-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated probe dependencies
        run: |
          python3 -m venv /tmp/cineworld-probe
          /tmp/cineworld-probe/bin/pip install curl_cffi==0.16.3 beautifulsoup4==4.13.4
      - name: Check London IMAX cinema pages
        run: /tmp/cineworld-probe/bin/python probes/cineworld.py
