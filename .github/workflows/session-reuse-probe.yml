name: BFI persistent browser session probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinema-session-reuse-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser cache key
        id: browser-key
        # Refresh upstream browser/GeoIP downloads weekly or when dependencies change.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Camoufox runtime
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ steps.browser-key.outputs.week }}
      - name: Download Camoufox runtime on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install camoufox-js fetch
      - name: Ensure virtual display tools
        run: |
          if command -v Xvfb >/dev/null && command -v xvfb-run >/dev/null && command -v xauth >/dev/null; then
            echo "Using preinstalled Xvfb and xauth"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth
          fi
      - name: Verify browser and install system libraries only if missing
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: xvfb-run -a -s "-screen 0 1440x900x24 -nolisten tcp" npm run prepare-browser
      - name: Save prepared Camoufox runtime
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Executable, addons and GeoIP only. Browser profiles live in temporary directories.
          path: ~/.cache/camoufox
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Collect up to ten times in one browser session
        run: timeout --signal=TERM --kill-after=10s 4800s xvfb-run -a -s "-screen 0 1440x900x24 -nolisten tcp" npx --no-install tsx scripts/session-reuse-probe.ts
      - name: Upload sanitized session diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-reuse-probe-${{ github.run_id }}
          path: work/session-reuse-probe/report.json
          retention-days: 1
          if-no-files-found: warn
