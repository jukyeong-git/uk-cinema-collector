name: uk-cinema-collector-scheduls
on:
  workflow_dispatch:
    inputs:
      deliver:
        description: Send the validated collection to the private receiver
        type: boolean
        required: true
        default: false
      duration_minutes:
        description: Session budget including setup (1-58 minutes; default 58)
        type: number
        required: false
        default: 58
permissions:
  contents: read
concurrency:
  group: cinema-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set session deadline
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes || 58 }}
        run: |
          node -e 'const n=Number(process.env.DURATION_MINUTES);if(!Number.isInteger(n)||n<1||n>58)process.exit(1);require("fs").appendFileSync(process.env.GITHUB_ENV,`COLLECTOR_END_AT=${Date.now()+n*60000}\n`);'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser cache key
        id: browser-key
        # Refresh upstream browser/GeoIP downloads weekly or when dependencies change.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Camoufox runtime
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ steps.browser-key.outputs.week }}
      - name: Download Camoufox runtime on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install camoufox-js fetch
      - name: Ensure virtual display tools
        run: |
          if command -v Xvfb >/dev/null && command -v xvfb-run >/dev/null && command -v xauth >/dev/null; then
            echo "Using preinstalled Xvfb and xauth"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth
          fi
      - name: Verify browser and install system libraries only if missing
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: xvfb-run -a -s "-screen 0 1440x900x24 -nolisten tcp" npm run prepare-browser
      - name: Save prepared Camoufox runtime
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Executable, addons and GeoIP only. Browser profiles live in temporary directories.
          path: ~/.cache/camoufox
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Check receiver configuration
        if: ${{ inputs.deliver }}
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          FUNCTION: ${{ secrets.RECEIVER_FUNCTION }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$FUNCTION" ] || [ -z "$REGION" ]; then
            echo "Receiver secrets have not been configured."
            exit 1
          fi
      - name: Authenticate receiver access
        if: ${{ inputs.deliver }}
        env:
          RECEIVER_ROLE: ${{ secrets.AWS_ROLE_ARN }}
          RECEIVER_REGION: ${{ secrets.AWS_REGION }}
        run: npx --no-install tsx scripts/authenticate-receiver.ts
      - name: Monitor all pages every minute in one browser session
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVER: ${{ inputs.deliver }}
          RECEIVER_FUNCTION: ${{ secrets.RECEIVER_FUNCTION }}
        run: xvfb-run -a -s "-screen 0 1440x900x24 -nolisten tcp" npx --no-install tsx src/monitor.ts
      - name: Remove transient data
        if: always()
        run: rm -f work/payload.json work/payload.json.tmp work/response.json work/pending-state.json
