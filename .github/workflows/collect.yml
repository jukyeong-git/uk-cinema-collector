name: Collect cinema schedules
on:
  workflow_dispatch:
    inputs:
      deliver:
        description: Send the validated collection to the private receiver
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cinema-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser cache key
        id: browser-key
        # Refresh upstream browser/GeoIP downloads weekly or when dependencies change.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Camoufox runtime
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ steps.browser-key.outputs.week }}
      - name: Download Camoufox runtime on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install camoufox-js fetch
      - name: Verify browser and install system libraries only if missing
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm run prepare-browser
      - name: Save prepared Camoufox runtime
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Executable, addons and GeoIP only. Browser profiles live in temporary directories.
          path: ~/.cache/camoufox
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Collect all pages
        run: npm run collect
      - name: Compare acknowledged collection hash
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run state -- compare
      - name: Check receiver configuration
        if: ${{ inputs.deliver && steps.compare.outputs.changed == 'true' }}
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          FUNCTION: ${{ secrets.RECEIVER_FUNCTION }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$FUNCTION" ] || [ -z "$REGION" ]; then
            echo "Receiver secrets have not been configured."
            exit 1
          fi
      - name: Authenticate receiver access
        if: ${{ inputs.deliver && steps.compare.outputs.changed == 'true' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: cinema-collection
          mask-aws-account-id: true
      - name: Deliver collection
        if: ${{ inputs.deliver && steps.compare.outputs.changed == 'true' }}
        env:
          RECEIVER_FUNCTION: ${{ secrets.RECEIVER_FUNCTION }}
        run: npm run deliver
      - name: Save hash after receiver acknowledgement
        if: ${{ inputs.deliver && steps.compare.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run state -- acknowledge
      - name: Remove transient data
        if: always()
        run: rm -f work/payload.json work/payload.json.tmp work/response.json work/pending-state.json
