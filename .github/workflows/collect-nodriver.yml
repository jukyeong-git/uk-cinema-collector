name: Compare Nodriver collection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinema-collection-nodriver
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install locked Nodriver Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Install locked Nodriver dependencies
        run: |
          python3 -m venv work/nodriver-venv
          work/nodriver-venv/bin/pip install -r experiments/nodriver/requirements.txt
          work/nodriver-venv/bin/python -c "import nodriver"
      - name: Show runner public IP
        run: |
          echo "Runner public IPv4:"
          if curl -4 --fail --silent --show-error --connect-timeout 5 --max-time 10 https://api.ipify.org; then
            echo
          else
            echo "::notice::Public IP lookup failed; continuing collection."
          fi
      - name: Collect all pages with Nodriver
        id: collect
        run: |
          export NODRIVER_BROWSER_PATH="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          work/nodriver-venv/bin/python scripts/collect-nodriver.py
      - name: Summarize comparison
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          {
            echo "## Nodriver comparison"
            echo "- Collection outcome: $COLLECTION_OUTCOME"
            echo "- Browser: headless Nodriver Chromium"
            echo "- Check logs for browser version, runner IPv4, HTTP status and Cloudflare Ray ID."
            echo "- Collection only: no Lambda delivery or acknowledged hash update."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove transient data
        if: always()
        run: rm -f work/payload.json work/payload.json.tmp
